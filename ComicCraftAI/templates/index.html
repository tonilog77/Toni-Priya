<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraftAI</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(rgba(255,255,255,.72), rgba(255,255,255,.72)),
                linear-gradient(135deg, #cfe8ff, #fff2cc);
            padding: 40px 16px;
        }

        .container {
            width: min(720px, 100%);
            margin: auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 7px;
        }

        textarea, input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea { min-height: 120px; resize: vertical; }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #1677d2;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover { background: #0e5eaa; }

        .note {
            background: #fff8d6;
            padding: 12px;
            border-radius: 8px;
            margin-top: 18px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>🎨 Create Your Comic</h1>

    <form action="/generate" method="post">
        <label>Story Prompt</label>
        <textarea name="story_prompt" required>A Brave fox explores an enchanted forest.</textarea>

        <label>Main Character Name</label>
        <input name="character_name" value="Free" required>

        <label>Setting</label>
        <select name="setting">
            <option>Forest</option>
            <option>School</option>
            <option>Future City</option>
            <option>Space</option>
            <option>Village</option>
            <option>Beach</option>
        </select>

        <label>Story Tone</label>
        <select name="tone">
            <option>light-hearted</option>
            <option>dramatic</option>
            <option>funny</option>
            <option>adventurous</option>
            <option>mysterious</option>
        </select>

        <label>Art Style</label>
        <select name="art_style">
            <option>comic book</option>
            <option>realistic</option>
            <option>cartoon</option>
            <option>watercolor</option>
            <option>anime</option>
        </select>

        <button type="submit">Generate Comic</button>
    </form>

    <div class="note">
        Gemini creates the story and panel prompts. Hugging Face creates the
        panel images when <b>HF_TOKEN</b> is configured.
    </div>
</div>
</body>
</html>
